[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unfold"
version = "0.1.1"
description = "Motore matematico puro per sviluppi piani di forme sviluppabili (cono, cilindro, profili piegati, ...). Zero dipendenze per il calcolo e per la lettura di un disegno; l'export DXF passa da forge (opzionale, installato a parte) — vedi MAP.md D43."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All rights reserved — source-available, no license granted (see LICENSE)" }
authors = [
    { name = "Federico Sidraschi" }
]
keywords = ["sheet-metal", "unfold", "cone", "cylinder", "flat-pattern", "cad"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
# forge NON è qui: è un pacchetto locale, non pubblicato. Per usare
# FlatGeometry.to_dxf() installalo a parte, es.:
#   pip install -e ../dxf-forge
# (MAP.md D43: un'integrazione più profonda con forge è stata provata e
# ritrattata l'11 set 2026 — non giustificata finché "pippo" non esiste.)

[tool.setuptools.packages.find]
where = ["."]
include = ["unfold*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
